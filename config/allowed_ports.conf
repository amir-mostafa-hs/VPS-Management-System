# ==============================================================================
# config/allowed_ports.conf — Declarative Additional Inbound Firewall Ports
# ==============================================================================
# Define additional inbound ports to open in UFW firewall, one per line.
# Format: <port>/<protocol> [optional description]
# Protocol must be tcp or udp (defaults to tcp if omitted).
# Lines beginning with # are treated as comments and ignored.
#
# Base ports are automatically allowed by harden-server.sh:
#   - SSH (port 22 or $SSH_PORT)
#   - 80/tcp (HTTP)
#   - 443/tcp (HTTPS)
#   - 8000/tcp (Coolify PaaS UI)
#
# Examples of additional services:
# 8080/tcp    Custom application web port
# 9000/tcp    Portainer / SonarQube
# 53/udp      DNS service
# 25565/tcp   Game server


# Additional ports to allow (one per line):
# SSH
OpenSSH
9011/tcp
6001/tcp
6002/tcp