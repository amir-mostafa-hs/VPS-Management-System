name: One-way Repository Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch destination
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          git remote add destination \
            https://x-access-token:${SYNC_TOKEN}@github.com/mrsbrwork/VPS-Management-System.git

          git fetch destination main

      - name: Merge source into destination
        run: |
          git checkout -B sync-target destination/main
          git merge --no-edit origin/main

      - name: Push merged changes
        run: |
          git push destination sync-target:main
