name: One-way Repository Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-way-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DESTINATION_REPO: ${{ vars.SYNC_DESTINATION_REPO || github.repository }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check sync token configuration
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "SYNC_REPO_TOKEN is missing or unavailable"
            exit 1
          fi
          echo "Sync token is configured"

      - name: Authenticate and fetch destination
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          set +x

          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w 0)" \
            ls-remote "https://github.com/${DESTINATION_REPO}.git" refs/heads/main

      - name: Fetch destination
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          git remote add destination \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${DESTINATION_REPO}.git"

          git fetch destination main

      - name: Merge source into destination
        run: |
          git checkout -B sync-target destination/main
          git merge --no-edit origin/main

      - name: Push merged changes
        run: |
          git push destination sync-target:main
