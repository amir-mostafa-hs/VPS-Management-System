name: One-way Repository Sync (A -> B)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-way-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.SYNC_DESTINATION_REPO != github.repository }}
    env:
      DESTINATION_REPO: ${{ vars.SYNC_DESTINATION_REPO }}
      SYNC_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
      EXCLUDE_PATHS: |
        .github/workflows/sync-repository.yml

    steps:
      - name: Validate configuration
        run: |
          if [ -z "$DESTINATION_REPO" ]; then
            echo "::error::Repository variable SYNC_DESTINATION_REPO is not set (owner/repo)."
            exit 1
          fi
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Secret SYNC_REPO_TOKEN is missing."
            exit 1
          fi

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify access to destination
        run: |
          if ! git ls-remote "https://x-access-token:${SYNC_TOKEN}@github.com/${DESTINATION_REPO}.git" HEAD >/dev/null 2>&1; then
            echo "::error::Cannot access ${DESTINATION_REPO}. Check token permissions and expiration."
            exit 1
          fi

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Remove excluded paths from history
        run: |
          args=()
          while IFS= read -r p; do
            [ -n "$p" ] && args+=(--path "$p")
          done <<< "$EXCLUDE_PATHS"

          if [ ${#args[@]} -gt 0 ]; then
            git filter-repo --force --invert-path "${args[@]}"
          fi

      - name: Mirror filtered main to destination
        run: |
          git remote add destination "https://x-access-token:${SYNC_TOKEN}@github.com/${DESTINATION_REPO}.git"
          git push destination HEAD:refs/heads/main --force
