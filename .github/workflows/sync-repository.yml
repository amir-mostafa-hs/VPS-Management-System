name: One-way Repository Sync (A -> B)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-way-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Prevent execution in the destination repository if the workflow is synced with the code
    if: ${{ vars.SYNC_DESTINATION_REPO != github.repository }}
    env:
      DESTINATION_REPO: ${{ vars.SYNC_DESTINATION_REPO }}
      SYNC_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}

    steps:
      - name: Validate configuration
        run: |
          if [ -z "$DESTINATION_REPO" ]; then
            echo "::error::Repository variable SYNC_DESTINATION_REPO is not set (format: owner/repo)."
            exit 1
          fi
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Secret SYNC_REPO_TOKEN is missing."
            exit 1
          fi
          if [ "$DESTINATION_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "::error::Destination repo must differ from the source repo."
            exit 1
          fi

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify access to destination
        run: |
          if ! git ls-remote "https://x-access-token:${SYNC_TOKEN}@github.com/${DESTINATION_REPO}.git" HEAD >/dev/null 2>&1; then
            echo "::error::Cannot access ${DESTINATION_REPO}. Check token permissions (Contents: Read and write), token repository access, and expiration."
            exit 1
          fi
          echo "Destination is reachable."

      - name: Mirror main to destination
        run: |
          git remote add destination "https://x-access-token:${SYNC_TOKEN}@github.com/${DESTINATION_REPO}.git"
          git push destination refs/remotes/origin/main:refs/heads/main --force
