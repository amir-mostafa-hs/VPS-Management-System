name: One-way Repository Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-way-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DESTINATION_REPO: ${{ vars.SYNC_DESTINATION_REPO || github.repository }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check sync token configuration
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "SYNC_REPO_TOKEN is missing or unavailable"
            exit 1
          fi
          echo "Sync token is configured"

      - name: Configure destination authentication
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          set +x
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote remove destination || true
          git remote add destination \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${DESTINATION_REPO}.git"

          git ls-remote destination refs/heads/main

      - name: Fetch destination branch
        run: |
          if git ls-remote --exit-code destination refs/heads/main >/dev/null 2>&1; then
            git fetch destination main
          else
            echo "Destination main branch not found, initial sync will create it."
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge source into destination
        run: |
          if git show-ref --verify --quiet refs/remotes/destination/main; then
            git checkout -B sync-target destination/main
            git merge --no-edit --allow-unrelated-histories origin/main
          else
            git checkout -B sync-target origin/main
          fi

      - name: Push merged changes
        run: |
          git push destination sync-target:main
